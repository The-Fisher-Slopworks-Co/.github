# Runs on this repo's own pushes and PRs, and is reusable from any other repo
# (`.github/workflows/reuse.yml`):
#
#   name: REUSE
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     reuse:
#       uses: The-Fisher-Slopworks-Co/.github/.github/workflows/reuse.yml@main
name: REUSE Compliance

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
