# Reusable: conventional-commit PR titles and no AI attribution in the PR.
#
# main only ever gains squashed pull requests, and GitHub uses the PR title as
# the squash commit subject and the PR body as its body. So the PR — not a
# local commit message — is where both rules actually have to hold.
#
# Call it from a repo (`.github/workflows/pr-title.yml`):
#
#   name: PR title
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   concurrency:
#     group: pr-title-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     pr-title:
#       uses: The-Fisher-Slopworks-Co/.github/.github/workflows/pr-title.yml@main
#       with:
#         scopes: |
#           bot
#           deps
#           github
name: PR title

on:
  workflow_call:
    inputs:
      scopes:
        description: Allowed scopes, one per line. Empty allows any scope.
        type: string
        default: ""
      require-scope:
        description: Fail a title that has no scope.
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            test
            ci
            perf
            revert
          scopes: ${{ inputs.scopes }}
          requireScope: ${{ inputs.require-scope }}
          subjectPattern: '^(?![A-Z]).+[^.\s]$'
          subjectPatternError: >-
            The subject "{subject}" of "{title}" is invalid: it must start with
            a lowercase letter, be phrased in the imperative ("add", not
            "Added"), and must not end with a period.

  attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    steps:
      - name: Scan title and body
        uses: actions/github-script@v9
        with:
          script: |
            const { title, body } = context.payload.pull_request;

            const PATTERNS = [
              // Co-author trailers, by the address each agent signs with.
              /noreply@(anthropic\.com|openai\.com|aider\.chat|opencode\.ai|z\.ai)\b/i,
              /\b(cursoragent@cursor\.com|amp@ampcode\.com|qwen-coder@alibabacloud\.com|copilot@github\.com)\b/i,
              /\d+\+(copilot|copilot-swe-agent|devin-ai-integration|factory-droid|gemini-code-assist|google-labs-jules)(\[bot\])?@users\.noreply\.github\.com/i,
              // Disclosure and session trailers, only at the start of a line.
              /^\s*(assisted-by|generated-by|ai-assisted|claude-session|copilot-session|amp-thread(-id)?)\s*:/im,
              // PR-body footers and links back to an agent's session.
              /generated with \[?(claude code|codex|copilot|cursor|opencode)\b/i,
              /claude\.ai\/code\/session_|ampcode\.com\/threads\/|app\.devin\.ai\/sessions\/|chatgpt\.com\/codex\/tasks\//i,
            ];

            const lines = `${title}\n${body ?? ""}`.split("\n");
            const hits = lines.filter((line) => PATTERNS.some((re) => re.test(line)));

            if (hits.length > 0) {
              core.setFailed(
                "Remove the AI attribution from the PR title/body (see CLAUDE.md → Definition of done):\n" +
                  hits.map((line) => `  ${line.trim()}`).join("\n"),
              );
            }
